coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        informational: true

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit
      paths:
        - src/
    - name: bindings
      paths:
        - src/

ignore:
  - 'tests/**/*'
  - 'coverage/**/*'
  - '.coverage/**/*'
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - 'playwright.config.ts'
  - 'nuxt.config.ts'
  - 'nuxt.config.library.ts'
  - 'wrangler.jsonc'
  - 'public/**/*'
  - 'dist/**/*'
  - '.nuxt/**/*'
  - '.output/**/*'

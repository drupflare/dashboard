coverage:
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: 50%
        threshold: 5%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

ignore:
  - 'tests/**/*'
  - 'coverage/**/*'
  - '.coverage/**/*'
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - 'playwright.config.ts'
  - 'nuxt.config.ts'
  - 'nuxt.config.library.ts'
  - 'wrangler.jsonc'
  - 'public/**/*'
  - 'dist/**/*'
  - '.nuxt/**/*'
  - '.output/**/*'

name: Feature request
description: Suggest a change or addition to the dashboard.
title: '[feat] '
labels: ['enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of the dashboard the request touches.
      options:
        - Sites and environments
        - Operations and health
        - Planes and onboarding
        - Migration
        - Billing and plans
        - Access, organizations and sign-in
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What the dashboard should do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other options you considered.
    validations:
      required: false

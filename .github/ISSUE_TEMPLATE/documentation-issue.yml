name: Documentation Issue
description: A page is wrong, unclear or missing.
title: '[docs] '
labels: ['documentation']
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or the path in the docs folder, for example docs/guides/sites.md.
    validations:
      required: true
  - type: dropdown
    id: problem-type
    attributes:
      label: Problem type
      options:
        - Wrong or out of date
        - Unclear
        - Missing
        - Broken link or code example
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is wrong
      description: Quote the sentence or step if you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: The text you would expect to read, if you have it.
    validations:
      required: false

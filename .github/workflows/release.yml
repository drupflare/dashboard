name: Release Project

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate Suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check the Tag Matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Check Prettier Formatting
        run: bun run prettier:check
      - name: Unit Tests
        run: bun run test:unit
      - name: Binding Tests
        run: bun run test:bindings
      - name: Build
        run: bun run build
      - name: Check the Wrangler Bindings
        run: bun run check:wrangler

  live:
    name: Live Lanes
    needs: gate
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read

  deploy:
    name: Deploy to Production
    needs: [gate, live]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm the Tag Is on the Default Branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::$GITHUB_REF_NAME is not on $DEFAULT_BRANCH, so it will not deploy" >&2
            exit 1
          }
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Check the Wrangler Bindings
        run: bun run check:wrangler
      - name: Render the Deploy Configs
        run: |
          bun scripts/render-deploy.ts dispatch production
          bun scripts/render-deploy.ts engine production
          bun scripts/render-deploy.ts dashboard production
      - name: Deploy the Dispatch Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dispatch
          command: deploy -c wrangler.deploy.json
      - name: Deploy the Engine Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: engine
          command: deploy -c wrangler.deploy.json
      - name: Deploy the Dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c .output/server/wrangler.deploy.json

  publish:
    name: Publish the Release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the Previous Tag
        id: previous
        run: |
          echo "tag=$(git describe --tags --abbrev=0 HEAD^ 2> /dev/null || echo '')" >> "$GITHUB_OUTPUT"
      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621 # v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ steps.previous.outputs.tag }}'
          toTag: '${{ github.ref_name }}'
      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: drupflare/dashboard ${{ github.ref_name }}
          body: |
            Commit: ${{ github.sha }}

            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

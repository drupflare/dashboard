name: End-to-End Lanes

on:
  push:
    branches: [master, ver/*, feat/*]
  pull_request:
    branches: [master, ver/*, feat/*]
  schedule:
    - cron: '17 6 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration Lane
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    concurrency:
      group: integration-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      GITHUB_TOKEN: ${{ github.token }}
      INTEGRATION: '1'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Start the Docker Stack
        if: ${{ hashFiles('docker/compose.yml') != '' }}
        run: docker compose -f docker/compose.yml up -d --wait
      - name: Run the Integration Lane
        run: bun run --if-present test:integration
      - name: Stop the Docker Stack
        if: ${{ always() && hashFiles('docker/compose.yml') != '' }}
        run: docker compose -f docker/compose.yml down -v || true
      - name: Name Missing Scripts
        if: ${{ !cancelled() }}
        run: |
          for s in test:integration; do
            jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null || echo "::notice::$s is not in package.json, so this lane ran nothing"
          done

  e2e:
    name: Browser End-to-End Lane
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build the Test Build
        run: bun run build:test
      - name: Install the Playwright Browser
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start the Docker Stack
        if: ${{ hashFiles('docker/compose.yml') != '' }}
        run: docker compose -f docker/compose.yml up -d --wait
      - name: Run the E2E Lane
        run: bun run --if-present test:e2e
      - name: Upload the Playwright Report on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop the Docker Stack
        if: ${{ always() && hashFiles('docker/compose.yml') != '' }}
        run: docker compose -f docker/compose.yml down -v || true
      - name: Name Missing Scripts
        if: ${{ !cancelled() }}
        run: |
          for s in test:e2e; do
            jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null || echo "::notice::$s is not in package.json, so this lane ran nothing"
          done

  live-smoke:
    name: Staging Smoke
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging

    permissions:
      contents: read
      packages: read

    concurrency:
      group: live-staging
      cancel-in-progress: false

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for Deploy-Relevant Paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PATTERN: '^(dispatch/|engine/|src/server/integrations/(cloudflare|dispatch)|wrangler[^/]*\.jsonc$|contracts/)'
        run: |
          if [ "$EVENT" = 'pull_request' ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          git cat-file -e "$base^{commit}" 2> /dev/null || base='HEAD~1'
          changed=$(git diff --name-only "$base" "$HEAD_SHA" 2> /dev/null | grep -E "$PATTERN" || true)
          if [ -n "$changed" ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi
          echo "deploy-relevant paths changed: ${changed:-none}"
      - name: Set up Bun
        if: ${{ steps.paths.outputs.run == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        if: ${{ steps.paths.outputs.run == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        if: ${{ steps.paths.outputs.run == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        if: ${{ steps.paths.outputs.run == 'true' }}
        run: bun install --frozen-lockfile
      - name: Check the Rate-Limit Headroom
        if: ${{ steps.paths.outputs.run == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:headroom
      - name: Deploy to the Staging Dashboard
        if: ${{ steps.paths.outputs.run == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:deploy
      - name: Run the Staging Smoke
        if: ${{ steps.paths.outputs.run == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:smoke
      - name: Clean Up the Staging Resources
        if: ${{ always() && steps.paths.outputs.run == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:cleanup
      - name: Name Missing Scripts
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: |
          for s in live:headroom live:deploy live:smoke live:cleanup; do
            jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null || echo "::notice::$s is not in package.json, so this lane ran nothing"
          done

  live-full:
    name: Live Full Matrix
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging

    permissions:
      contents: read
      packages: read

    concurrency:
      group: live-staging
      cancel-in-progress: false

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check the Rate-Limit Headroom
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:headroom
      - name: Deploy to the Staging Dashboard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:deploy
      - name: Run the Live Full Matrix
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:full
      - name: Clean Up the Staging Resources
        if: ${{ always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:cleanup
      - name: Name Missing Scripts
        if: ${{ !cancelled() }}
        run: |
          for s in live:headroom live:deploy live:full live:cleanup; do
            jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null || echo "::notice::$s is not in package.json, so this lane ran nothing"
          done

  sweep:
    name: Nightly Sweep
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging

    permissions:
      contents: read
      packages: read

    concurrency:
      group: live-staging
      cancel-in-progress: false

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Sweep the Temporary Staging Resources
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:sweep
      - name: Name Missing Scripts
        if: ${{ !cancelled() }}
        run: |
          for s in live:sweep; do
            jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null || echo "::notice::$s is not in package.json, so this job ran nothing"
          done

  certification:
    name: Certification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: staging

    permissions:
      contents: read
      packages: read

    concurrency:
      group: live-staging
      cancel-in-progress: false

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the Bun Install Cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check the Rate-Limit Headroom
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:headroom
      - name: Deploy to the Staging Dashboard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:deploy
      - name: Run the Certification
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present test:certification
      - name: Clean Up the Staging Resources
        if: ${{ always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run --if-present live:cleanup
      - name: Name Missing Scripts
        if: ${{ !cancelled() }}
        run: |
          for s in live:headroom live:deploy test:certification live:cleanup; do
            jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null || echo "::notice::$s is not in package.json, so this job ran nothing"
          done

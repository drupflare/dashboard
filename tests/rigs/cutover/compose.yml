name: cutover-rig

services:
  db:
    image: mariadb@sha256:2fd6d83be13d6f95119fe7823c4a445a771d973ce15a4f4621e3c14898f9f1ab
    mem_limit: 1g
    cpus: 1
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupalpass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 40

  drupal:
    image: drupal@sha256:d059fada2d2f9ebfcde8f8d3208007946d1ee843ee2dd9ed00b15ead0c282def
    mem_limit: 2g
    cpus: 1.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_NAME: drupal
      DRUPAL_DB_USER: drupal
      DRUPAL_DB_PASSWORD: drupalpass
      DRUPAL_SITE_MAIL: e2e@example.com
      SSH_USER: tester
      SSH_PUBLIC_KEY: ${CUTOVER_RIG_PUBKEY:-}
    entrypoint: ['/bin/bash', '/opt/drangler/entrypoint.sh']
    volumes:
      - ./drupal:/opt/drangler:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/opt/drangler-ready']
      interval: 5s
      timeout: 5s
      retries: 240
    ports:
      - '127.0.0.1:${CUTOVER_RIG_SSH_PORT:-2232}:22'
      - '127.0.0.1:${CUTOVER_RIG_WEB_PORT:-8190}:80'
